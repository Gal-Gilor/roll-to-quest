[project]
name = "roll-to-quest"
version = "0.1"
description = "Example scripts playground"
authors = [{ name = "Gal Gilor", email = "gilorgal2010@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.12.0,<3",
    "pydantic-settings>=2.11.0,<3",
    "fastapi>=0.118.3,<0.119",
    "uvicorn>=0.37.0,<0.38",
    "aiohttp>=3.13.0,<4",
    "jinja2>=3.1.6,<4",
    "google-genai>=1.42.0,<2",
    "google-cloud-storage>=3.4.1,<4",
    "gcloud-aio-storage>=9.6.0,<10",
    "peft>=0.17.1,<0.18",
    "accelerate>=1.10.1,<2",
    "torch>=2.9.0,<3",
    "pinecone>=7.3.0,<8",
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=1.2.0,<2",
    "datasets>=3.2.0,<4",
    "huggingface-hub>=0.34.0,<1.0.0",
    "tokenizers==0.22.1",
    "transformers>=4.57.3,<5",
    "tqdm>=4.67.3,<5",
    "aiolimiter>=1.2.1,<2",
    "pymupdf4llm>=0.3.3,<0.4",
    "markitdown[pdf]>=0.1.4,<0.2",
    "pymupdf-layout>=1.27.1,<2",
    "pytesseract>=0.3.13,<0.4",
    "opencv-python>=4.13.0.92,<5",
    "docling>=2.73.1,<3",
    "pyyaml>=6.0.3,<7",
    "neo4j>=6.2.0,<7",
    "gradio>=5.49.0,<6",
    "markdown-chunkify>=0.3.0,<0.4",
    "networkx>=3.6,<4",
    "rank-bm25>=0.2.2,<0.3",
    "pyvis>=0.3.2,<0.4",
    "sentence-transformers>=5.1,<6",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1,<7",
    "ruff>=0.14.0,<0.15",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 94
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["."]


